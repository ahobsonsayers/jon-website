services:
  - title: Direction
    description: Sketch, sitcom and live comedy — from read-through to final grade.
  - title: Writing
    description: Script edits, punch-up passes and formats that survive contact with production.
  - title: Development
    description: Taking a comedian's idea from "trust me" to a tape that gets commissioned.
  - title: Performance Coaching
    description: Making presenters funny and actors loose, without killing what makes them watchable.

testimonials:
  - quote: Jon turned half a page of notes into the best thing we've made all year.
    author: Sam Okafor
    source: Executive Producer, Channel 4
  - quote: He directs like an editor and edits like a writer. Unfair, really.
    author: Priya Nair
    source: Commissioning Editor, BBC Comedy
  - quote: The only director our act has worked with twice. That's the review.
    author: Fox & Fielding
    source: Double Act
  - quote: Delivered on budget, a week early, with jokes we didn't write in it.
    author: Marcus Webb
    source: Head of Content, streaming thing

