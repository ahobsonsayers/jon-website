site:
  name: Jon Masters
  role: Comedy Director · Writer · Performer

hero:
  tagline: I make funny things for television, stage and the internet.
  sub: >-
    Twenty years of sketches, sitcoms and sell-out live shows — directed,
    written and occasionally performed, always with the jokes first.

about:
  photo: images/jon.svg
  paragraphs:
    - >-
      Jon Masters is a comedy director based in London. He has directed
      BAFTA-nominated sketch shows, fringe shows that sold out before anyone
      had heard of the acts, and more branded-content sketches than he
      will admit to at parties.
    - >-
      He works with writers early, shoots fast and edits tighter than the
      budget deserves. If it gets a laugh in the room and a bigger laugh on
      the upload, it ships.

